# The Argo CD Application for CIRRUS, ready to hand to the CIRRUS team (they create it; we do not have access to).
# It follows the mesonet one: a branch named "cirrus" of our repository, one folder, one namespace, same cluster.
# Nothing here is secret.
#
# Before it works:
#   - the branch "cirrus" must exist in the repository (it is where we publish what CIRRUS should run),
#   - the repository is public, so Argo CD needs no key or token to read it,
#   - "project" must be the Argo CD project they give us.
#
# The folder is "cirrus-direct": the same as "cirrus" without the three vault objects, because the two Secrets
# (openiotwx, openiotwx-db) were created by hand in the namespace. Those Secrets are not in git, so Argo CD leaves them
# alone (it only prunes what it created). When a vault token for our path exists, change the path to
# deploy/k8s/overlays/cirrus.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openiotwx
  namespace: argocd # CONFIRM: where their Argo CD keeps Applications
spec:
  project: openiotwx # CONFIRM: the Argo CD project they give us
  source:
    repoURL: https://github.com/NCAR/OpenIoTwxNG.git
    targetRevision: cirrus
    path: deploy/k8s/overlays/cirrus-direct
  destination:
    server: https://kubernetes.default.svc
    namespace: openiotwx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # the namespace is made for us
      - PruneLast=true
