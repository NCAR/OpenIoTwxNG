# CIRRUS without the vault and without Argo CD: everything in ../cirrus, except the three vault objects. The two Secrets
# ("openiotwx" and "openiotwx-db") are created by hand in the namespace instead (docs/CIRRUS.md, "Deploy it ourselves"),
# and this folder is applied with kubectl. Nothing here is secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../cirrus

patches:
  - target: { kind: ExternalSecret, name: openiotwx }
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: openiotwx
  - target: { kind: ExternalSecret, name: openiotwx-db }
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: openiotwx-db
  - target: { kind: SecretStore, name: openiotwx-ro }
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: SecretStore
      metadata:
        name: openiotwx-ro
