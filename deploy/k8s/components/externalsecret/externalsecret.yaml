# The two Secrets the app needs, filled in from the cluster's vault (OpenBao) by the External Secrets operator, the same
# way the mesonet application gets its passwords. No password is ever in git or typed into the cluster.
#
# The vault entry holds just TWO values (generate them once; see docs/CIRRUS.md):
#   POSTGRES_PASSWORD     the dedicated database's password            e.g. openssl rand -hex 24
#   BETTER_AUTH_SECRET    signs the login sessions (32+ characters)    e.g. openssl rand -base64 48
# The database address is built here from the password, so the two can never disagree.
#
# CHANGE-ME (ask the CIRRUS team, who set up the vault side):
#   - secretStoreRef.name   the SecretStore in our namespace that may read our vault path (mesonet's is "iotwx-ro")
#   - remoteRef.key         our vault path (mesonet's is "iotwx/cirrus"; ours should be separate, e.g. "openiotwx/cirrus")
#
# Argo CD applies these first (sync-wave -2), so the Secrets exist before the database and the migration need them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openiotwx
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openiotwx-ro # CHANGE-ME
    kind: SecretStore
  target:
    name: openiotwx
    template:
      engineVersion: v2
      data:
        BETTER_AUTH_SECRET: "{{ .betterAuthSecret }}"
        DATABASE_URL: "postgres://iotwx:{{ .postgresPassword | urlquery }}@openiotwx-db:5432/iotwx"
        # Optional features: add a property to the vault entry, a line in "data" below, and a line here. For example:
        # HUB_TOKEN: "{{ .hubToken }}"
  data:
    - secretKey: betterAuthSecret
      remoteRef:
        key: openiotwx/cirrus # CHANGE-ME
        property: BETTER_AUTH_SECRET
    - secretKey: postgresPassword
      remoteRef:
        key: openiotwx/cirrus # CHANGE-ME
        property: POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openiotwx-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openiotwx-ro # CHANGE-ME
    kind: SecretStore
  target:
    name: openiotwx-db
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: openiotwx/cirrus # CHANGE-ME
        property: POSTGRES_PASSWORD
