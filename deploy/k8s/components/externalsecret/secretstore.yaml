# How our namespace reads the vault (OpenBao). This is the same shape as the SecretStore the mesonet application uses
# ("iotwx-ro" in its namespace): the vault server, the "kv/" mount (version 2), and a vault token kept in a Kubernetes
# Secret called "baotoken". Nothing here is secret.
#
# The ONE thing this file cannot hold is the token. It is a read-only vault token for OUR path (openiotwx/), issued by
# the CIRRUS team, and it is put in the cluster by hand, never in git:
#
#   kubectl -n openiotwx create secret generic baotoken --from-literal=token='<the token>'
#
# Until that Secret exists this store reports "invalid" and the two ExternalSecrets wait: nothing else is harmed.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openiotwx-ro
  annotations:
    argocd.argoproj.io/sync-wave: "-3" # before the ExternalSecrets that use it (wave -2)
spec:
  provider:
    vault:
      server: https://bao.k8s.ucar.edu
      path: kv/
      version: v2
      auth:
        tokenSecretRef:
          name: baotoken
          key: token
  retrySettings:
    maxRetries: 5
    retryInterval: 20s
